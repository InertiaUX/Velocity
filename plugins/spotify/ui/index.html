<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify</title>
    <style>
      :root {
        --bg: #0f1412;
        --panel: #152019;
        --ink: #f3f7f4;
        --muted: #8fa396;
        --green: #1db954;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: radial-gradient(120% 80% at 50% 0%, #1a3d28, var(--bg));
        color: var(--ink);
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      }
      .wrap {
        height: 100%;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .lede { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
      .card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 14px;
      }
      .art {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 12px;
        background: linear-gradient(145deg, #1db95433, #000);
        display: grid;
        place-items: center;
        font-size: 48px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .art img { width: 100%; height: 100%; object-fit: cover; }
      .track { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
      .artist { margin: 0; color: var(--muted); font-size: 13px; }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1.2fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px;
        font-weight: 700;
        cursor: pointer;
        background: rgba(255,255,255,0.08);
        color: var(--ink);
      }
      button.primary { background: var(--green); color: #04140a; }
      button:disabled { opacity: 0.45; cursor: default; }
      .field { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .field input {
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.12);
        background: #0c1210;
        color: var(--ink);
        padding: 10px;
      }
      .status { font-size: 12px; color: var(--muted); min-height: 1.2em; }
      .vol { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
      .vol input { flex: 1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h1>Spotify</h1>
        <p class="lede">Control playback from your Velocity phone.</p>
      </div>
      <div class="card" id="connect-card">
        <p class="lede">Connect a Spotify account (Premium required for remote control).</p>
        <div class="field">
          <label for="client-id">Spotify Client ID</label>
          <input id="client-id" placeholder="from developer.spotify.com" />
        </div>
        <button class="primary" id="connect" style="width:100%;margin-top:12px">Connect</button>
        <p class="status" id="status"></p>
      </div>
      <div class="card" id="player-card" hidden>
        <div class="art" id="art">♪</div>
        <p class="track" id="track">Not playing</p>
        <p class="artist" id="artist"></p>
        <div class="controls">
          <button id="prev">Prev</button>
          <button class="primary" id="toggle">Play</button>
          <button id="next">Next</button>
        </div>
        <div class="vol">
          <span>Vol</span>
          <input id="volume" type="range" min="0" max="100" value="50" />
        </div>
        <button id="disconnect" style="width:100%;margin-top:12px">Disconnect</button>
        <p class="status" id="player-status"></p>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
