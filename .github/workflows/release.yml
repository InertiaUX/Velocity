name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            package: |
              ARCH=arm64 ./scripts/package-mac-release.sh
          - os: macos-latest
            name: macos-x86_64
            package: |
              ARCH=x86_64 ./scripts/package-mac-release.sh
          - os: windows-latest
            name: windows-x64
            package: |
              ./scripts/package-windows-release.sh
          - os: ubuntu-22.04
            name: linux-x86_64
            package: |
              ./scripts/package-linux-release.sh

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      # npm ci on a macOS-generated lockfile often skips other-OS optional
      # bindings for @tauri-apps/cli; reinstall the CLI so the runner platform binding is present.
      - name: Ensure Tauri CLI binding
        shell: bash
        run: npm install --no-save --workspace=@velocity/desktop @tauri-apps/cli@2.11.4

      - name: Package
        shell: bash
        run: ${{ matrix.package }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velocity-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f | sort && ls -lah artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
