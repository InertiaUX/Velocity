[package]
name = "velocity"
version = "0.1.1"
description = "Velocity - desktop phone companion"
authors = ["InertiaUX"]
edition = "2021"

[lib]
name = "velocity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "unstable"] }
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5"
base64 = "0.23.1"
muda = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSData", "NSError", "NSArray"] }
plist = "1"
